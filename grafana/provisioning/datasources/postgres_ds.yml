# config file version
apiVersion: 1

# list of datasources to insert/update
# available in the database
datasources:
  - name: Postgres
    type: postgres
    url: db_service:5432
    user: postgres
    secureJsonData:
      password: 'postgres'
    jsonData:
      database: ny_taxi
      sslmode: 'disable'
    isDefault: true