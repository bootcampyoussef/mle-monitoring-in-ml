version: '3.7'

services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ny_taxi
    ports:
      - "5432:5432"

  grafana:
      image: grafana/grafana
      ports:
          - 3000:3000
      restart: unless-stopped
      volumes:
          - ./grafana:/etc/grafana/
          - grafana-data:/var/lib/grafana

volumes:
    dbdata:
    grafana-data: